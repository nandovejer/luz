<template id="site-prompt-dialog" data-read="{{t:prompt.read}}" data-locked="{{t:prompt.locked}}" data-unlocked="{{t:prompt.unlocked}}" data-copied="{{t:prompt.copied}}" data-not-copied="{{t:prompt.not-copied}}" data-failed="{{t:prompt.failed}}" data-loading="{{t:prompt.loading}}" data-end="{{t:prompt.end}}">
  <dialog class="luz-modal site-prompt" aria-labelledby="site-prompt-title">
    <div class="luz-modal__header site-prompt__head">
      <h2 class="luz-modal__title" id="site-prompt-title"></h2>
      <button class="luz-btn luz-btn--ghost luz-btn--sm" type="button" data-prompt-close>{{t:prompt.close}}</button>
    </div>
    <p class="site-prompt__help" id="site-prompt-help">{{t:prompt.help}}</p>
    <div class="site-prompt__text" tabindex="0" role="region" aria-label="{{t:prompt.region}}"></div>
    <div class="site-prompt__foot">
      <progress class="luz-progress site-prompt__progress" max="100" value="0" aria-labelledby="site-prompt-read"></progress>
      <span class="site-prompt__read" id="site-prompt-read"></span>
      <button class="luz-btn luz-btn--primary" type="button" aria-disabled="true" aria-describedby="site-prompt-help" data-prompt-copy>{{t:prompt.copy}}</button>
      <a class="site-prompt__file" href="" data-prompt-file>{{t:prompt.file}}</a>
    </div>
    <p class="u-sr-only" role="status" data-prompt-status></p>
  </dialog>
</template>
