<header class="site-header" id="site-header">
  <div class="site-header__inner">
    <a class="site-header__brand" href="{{home}}"><span class="site-header__mark"><svg viewBox="0 0 32 32" width="22" height="22" stroke-width=".4" stroke-linejoin="round" aria-hidden="true" focusable="false"><path fill="currentColor" fill-opacity="0.25" d="M20.8 10.46 7.04 17.66 23.36 14.89Z"/><path fill="currentColor" fill-opacity="0.45" d="M23.36 14.89 7.04 17.66 25.92 19.33Z"/><path fill="currentColor" fill-opacity="0.65" d="M25.92 19.33 7.04 17.66 28.48 23.76Z"/><path fill="currentColor" fill-rule="evenodd" d="M20.8 10.46 16 2.14 7.04 17.66ZM32 29.86 28.48 23.76 7.04 17.66 0 29.86Z"/></svg></span><span class="u-sr-only">LUZ</span></a>
    <nav class="site-header__nav" aria-label="{{t:site.label}}">
      <a href="/docs/"><svg class="site-header__nav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" d="M12 6.5C10.5 5 8 4.5 4 4.5v13c4 0 6.5.5 8 2 1.5-1.5 4-2 8-2v-13c-4 0-6.5.5-8 2Zm0 0v13"/></svg>{{t:site.docs}}</a>
    </nav>
    <a class="site-header__github" href="https://github.com/nandovejer/luz"><svg class="site-header__nav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7.75v8.5M17 9.25c0 4.5-10 3-10 7"/><circle cx="7" cy="5.5" r="2.25"/><circle cx="7" cy="18.5" r="2.25"/><circle cx="17" cy="7" r="2.25"/></g></svg><span class="site-header__github-label">GitHub</span></a>
    <luz-search>
      <a class="luz-search__fallback site-header__az" href="/docs/a-z/" data-luz-search-fallback>
        <svg class="luz-search__trigger-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
        <span class="luz-search__fallback-label">{{html:header.az}}</span>
      </a>
      <button class="luz-search__trigger luz-search__trigger--compact site-header__search" type="button" data-luz-search-open aria-haspopup="dialog" aria-keyshortcuts="Control+K Meta+K" title="{{t:header.search-title}}" hidden>
        <svg class="luz-search__trigger-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
        <span class="luz-search__trigger-label">{{t:header.search}}</span>
        <kbd class="luz-search__trigger-key" aria-hidden="true">Ctrl K</kbd>
      </button>
      <dialog class="luz-modal luz-search" id="luz-search" aria-labelledby="luz-search-title"
              data-luz-search-src="/docs/search-index.json"
              data-luz-label-results="{{t:search.results}}"
              data-luz-label-result="{{t:search.result}}"
              data-luz-label-capped="{{t:search.capped}}"
              data-luz-label-none="{{t:search.none}}"
              data-luz-label-loading="{{t:search.loading}}"
              data-luz-label-error="{{t:search.error}}">
        <search class="luz-search__body">
          <div class="luz-search__head">
            <h2 class="luz-search__title" id="luz-search-title"><label for="luz-search-q">{{t:search.title}}</label></h2>
            <form method="dialog"><button class="luz-btn luz-btn--ghost luz-search__close" aria-label="{{t:search.close}}"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6 6 18"/></svg></button></form>
          </div>
          <div class="luz-search__field">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
            <input class="luz-input" id="luz-search-q" type="text" maxlength="100" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go" autofocus aria-describedby="luz-search-hint">
          </div>
          <p class="luz-field__helper" id="luz-search-hint">{{t:search.hint}}</p>
          <p class="luz-search__status" role="status"></p>
          <div class="luz-search__results" data-luz-search-results>
            <div hidden><h3>{{t:search.pages}}</h3><ul data-luz-search-list="pages" lang="en"{{endir}}></ul></div>
            <div hidden><h3>{{t:search.sections}}</h3><ul data-luz-search-list="sections" lang="en"{{endir}}></ul></div>
            <div hidden><h3>{{t:search.elements}}</h3><ul data-luz-search-list="elements" lang="en"{{endir}}></ul></div>
          </div>
          <p class="luz-search__foot">{{t:search.not-found}} <a href="/docs/a-z/">{{t:search.az}}</a></p>
        </search>
      </dialog>
    </luz-search>
    {{langswitch}}
    <button class="luz-nav-toggle site-header__menu" type="button" aria-label="{{t:header.menu}}" popovertarget="page-nav">
      <svg class="site-header__menu-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <rect class="site-header__menu-bar" x="3" y="5" width="18" height="2" rx="1"/>
        <rect class="site-header__menu-bar" x="3" y="11" width="18" height="2" rx="1"/>
        <rect class="site-header__menu-bar" x="3" y="17" width="18" height="2" rx="1"/>
      </svg>
    </button>
  </div>
</header>
