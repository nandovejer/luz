  <script src="/packages/core/dist/theme-boot.min.js"></script>
  <script src="/packages/catalog/dist/theme-time-boot.min.js" data-moments="dawn@05:00=dark morning@07:30=light afternoon@12:00=light* sunset@17:30=light dusk@20:30=dark night@22:30=dark*"></script>
  <link rel="stylesheet" href="/apps/docs/reference.css">
  <link rel="stylesheet" href="/apps/docs/elements.css">
</head>
<body class="o-shell luz-docs-layout docs-page site-sky">
  <a class="luz-skip-link" href="#main-content">{{t:chrome.skip}}</a>

  <!-- luz:include header -->

  <nav class="luz-sidebar page-nav luz-docs-nav" id="page-nav" popover aria-label="{{t:chrome.nav}}" tabindex="-1">
    <!-- luz:include site-links -->
{{nav}}
  </nav>
{{rail}}

  <main class="o-main luz-docs-main" id="main-content" tabindex="-1">
{{pagehead}}
  {{notice}}<div class="docs-body"{{contentattrs}}>
{{content}}
{{generated}}
  </div>
{{endnav}}
{{pagefoot}}
  </main>

  <!-- luz:include footer -->

  <!-- luz:include sky-filter -->

  <script type="module" src="/apps/docs/reference.js"></script>
</body>
</html>
