name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main, dev]
  # Reused by publish.yml so a release can never skip these checks. publish.yml
  # skips the UI shards below and runs the full suite itself (ui-tests.yml)
  workflow_call:
    inputs:
      skip-ui:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint CSS & JS
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint CSS
        run: pnpm lint:css

      - name: Lint JS
        run: pnpm lint:js

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Audit (high and above)
        run: pnpm audit --audit-level=high

  build-and-test:
    name: Build, unit tests & tarball contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # Full history: each docs page shows the date of its last commit
      # (`git log -1 -- <file>`), so the Pages build needs more than one commit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The packages and the Pages site (docs/, git-ignored build output): a
      # broken page or link fails the pull request here, and the checks below
      # that measure or compare the built site have it to read. pages.yml
      # builds it again on main to deploy it.
      - name: Run build and the Pages build
        run: pnpm pages:build

      # RL-19: llms.txt, the manifests, the examples, the README blocks and the
      # agent snapshot are what the generators write; a stale one fails
      - name: Check the files for AI agents
        run: pnpm check:ai

      # After the build: the dist-dependent suites are skipped without dist/.
      # LUZ_RELEASE: on main (and PRs into it) the red-line debt register
      # must be empty (PRINCIPLES.md, Migration)
      - name: Run unit tests
        run: pnpm test:unit
        env:
          LUZ_RELEASE: ${{ github.ref == 'refs/heads/main' || github.base_ref == 'main' }}

      - name: Check tarball contents
        run: pnpm check:pack

      - name: Check size budgets
        run: pnpm check:size

      - name: Check shipped strings
        run: pnpm check:strings

      # Red line 7: text 4.5:1, focus ring and borders 3:1, three themes
      - name: Check token contrast
        run: pnpm check:contrast

      - name: Check exceptions register
        run: pnpm check:exceptions

      # RL-1, RL-13: published packages are MIT with no dependencies; every
      # development dependency has an allowed licence; dev/LICENSES.md is current
      - name: Check licences
        run: pnpm check:license

  # The whole Playwright suite in twelve shards (ui-tests.yml), whatever the
  # change, so a pull request has its verdict in 30 minutes at most
  # (PRINCIPLES.md SR-10). `pnpm test:affected` is for working locally.
  ui-shards:
    name: UI shards
    if: inputs.skip-ui != true
    uses: ./.github/workflows/ui-tests.yml

  # The name stays "UI Tests (Playwright)": a required check of the ruleset
  # resolves by it. A skipped required check would count as passed, so this job
  # runs whatever the shards did and fails unless all of them passed.
  test-ui:
    name: UI Tests (Playwright)
    needs: ui-shards
    if: always() && inputs.skip-ui != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every shard passed
        env:
          RESULT: ${{ needs.ui-shards.result }}
        run: |
          echo "UI shards: $RESULT"
          test "$RESULT" = success

  # SR-9: a pull request that changes packages/, apps/ or scripts/ carries a
  # `test:` commit that fails on its own on top of the base. The script checks
  # that commit out alone in a worktree of the base and runs its test files,
  # expecting them to fail. Only the `pull_request` event (never the one that runs
  # with the base repository's secrets): the PR's code gets a read-only token and no secrets.
  red-commit:
    name: Red commit (test first)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Prove the test commit fails on the base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-red-commit.js "$BASE_SHA" "$HEAD_SHA"
