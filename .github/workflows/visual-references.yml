name: Visual references

# Reference screenshots for the visual specs, made on the runner's own image
# (Chromium on Linux), so they are never compared with a developer's machine.
# On demand only: a pull request with the label `visual`, or by hand (Actions >
# Visual references > Run workflow). The comparison itself is part of the whole
# suite (ui-tests.yml) and blocks; this only makes new references to download.
# A workflow of its own, so adding the label never cancels the pull request's CI.

on:
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The CI copies are artifacts only, not committed by CI: the job has no write
  # token, and the tree tracks the references of other machines.
  visual-references:
    name: Visual references (Chromium, Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'labeled' && github.event.label.name == 'visual') ||
      (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'visual'))
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run build
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Make the reference screenshots
        run: pnpm exec playwright test tests/visual.spec.js --project=chromium --update-snapshots

      # Pinned by commit SHA of the tag v7.0.1 (2026-04-10)
      - name: Upload the references
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-references
          path: |
            tests/visual.spec.js-snapshots/*.png
          if-no-files-found: error
          retention-days: 14
