name: Release

# Flow (changesets):
#   1. PRs add a changeset (`pnpm changeset`).
#   2. On push to main this workflow opens/updates the "Version Packages" PR.
#   3. Merging that PR leaves no pending changesets → the publish job runs.
#
# Publishing uses npm trusted publishing (OIDC): no npm token is stored
# anywhere. The `release` environment must exist with a required reviewer,
# and each package must list this workflow as its trusted publisher.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The UI smoke is skipped here: the pull request ran it, and the whole suite
  # runs below (ui-full) once a publish is certain
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      skip-ui: true

  version:
    name: Version PR
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      pull-requests: write
    outputs:
      hasChangesets: ${{ steps.changesets.outputs.hasChangesets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      # No lifecycle scripts while a contents: write token sits in .git/config
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # No `publish` input: this job can only open the version PR.
      # v1, not v2: v2 needs the Changesets CLI v3 and the repo is on v2.
      # Pinned by commit SHA of the tag v1.9.0 (2026-06-03)
      - name: Create or update the version PR
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm release:version
          title: "chore(release): version packages"
          commit: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Every version that leaves has passed the whole Playwright suite on this
  # commit, not only the specs its pull request touched
  ui-full:
    name: UI tests (full)
    needs: version
    if: needs.version.outputs.hasChangesets == 'false'
    uses: ./.github/workflows/ui-tests.yml

  publish:
    name: Publish to npm
    needs: [version, ui-full]
    if: needs.version.outputs.hasChangesets == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: release
    permissions:
      contents: read
      id-token: write # npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # Trusted publishing needs npm >= 11.5.1, which ships with Node 24
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      # No lifecycle scripts while this job can mint an OIDC token: the build
      # (esbuild included) works without them
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build all packages
        run: pnpm build

      - name: Check tarball contents
        run: pnpm check:pack

      # Skips versions already on the registry; any other failure stops the job
      - name: Publish unpublished versions
        run: node scripts/publish.js
