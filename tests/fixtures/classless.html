<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LUZ bare element and its component</title>
  <link rel="stylesheet" href="/packages/tokens/dist/luz-tokens.css">
  <link rel="stylesheet" href="/packages/core/dist/luz.css">
  <style>
    body { padding: 80px; }
  </style>
</head>
<body>
  <!-- Bare elements, no attribute anywhere, and next to each the component that is its reference -->
  <article id="scope">
    <button id="button" type="button">Save</button>
    <button id="submit" type="submit">Send</button>
    <button id="button-disabled" type="button" disabled>Off</button>
    <input id="input-button" type="reset" value="Reset">
    <button id="ref-button" class="luz-btn luz-btn--secondary" type="button">Save</button>
    <button id="ref-submit" class="luz-btn luz-btn--primary" type="submit">Send</button>
    <button id="ref-button-disabled" class="luz-btn luz-btn--secondary" type="button" disabled>Off</button>

    <input id="input" type="text" aria-label="Name">
    <input id="input-email" type="email" aria-label="Email">
    <input id="input-date" type="date" aria-label="Date">
    <input id="input-readonly" type="text" aria-label="Read only" readonly value="x">
    <input id="input-disabled" type="text" aria-label="Disabled" disabled>
    <textarea id="textarea" aria-label="Notes"></textarea>
    <input id="ref-input" class="luz-input" type="text" aria-label="Name">
    <input id="ref-input-date" class="luz-input" type="date" aria-label="Date">
    <input id="ref-input-readonly" class="luz-input" type="text" aria-label="Read only" readonly value="x">
    <input id="ref-input-disabled" class="luz-input" type="text" aria-label="Disabled" disabled>
    <textarea id="ref-textarea" class="luz-input luz-input--textarea" aria-label="Notes"></textarea>

    <select id="select" aria-label="Pick"><option>One</option><option>Two</option></select>
    <select id="select-multiple" aria-label="Pick many" multiple><option>One</option><option>Two</option></select>
    <select id="ref-select" class="luz-select" aria-label="Pick"><option>One</option><option>Two</option></select>
    <select id="ref-select-multiple" class="luz-select" aria-label="Pick many" multiple><option>One</option><option>Two</option></select>

    <table id="table"><caption>Releases</caption><thead><tr><th scope="col">Name</th><th scope="col">Version</th></tr></thead><tbody><tr><td>Core</td><td>2.1.0</td></tr><tr><td>Tokens</td><td>2.1.0</td></tr></tbody></table>
    <table id="ref-table" class="luz-table"><caption>Releases</caption><thead><tr><th scope="col">Name</th><th scope="col">Version</th></tr></thead><tbody><tr><td>Core</td><td>2.1.0</td></tr><tr><td>Tokens</td><td>2.1.0</td></tr></tbody></table>

    <details id="details"><summary>More</summary><p>Hidden text.</p></details>
    <div id="ref-accordion" class="luz-accordion"><details id="ref-details"><summary>More</summary><p>Hidden text.</p></details></div>

    <dialog id="dialog" open><p>A dialog</p></dialog>
    <dialog id="ref-dialog" class="luz-modal" open><p>A dialog</p></dialog>

    <meter id="meter" min="0" max="100" value="40" aria-label="Disk">40</meter>
    <meter id="ref-meter" class="luz-meter" min="0" max="100" value="40" aria-label="Disk">40</meter>
    <progress id="progress" max="100" value="40" aria-label="Upload">40</progress>
    <progress id="ref-progress" class="luz-progress" max="100" value="40" aria-label="Upload">40</progress>

    <pre id="pre"><code>const a = 1;</code></pre>
    <pre id="ref-pre" class="luz-code-block"><code>const a = 1;</code></pre>

    <fieldset id="fieldset"><legend>Contact</legend></fieldset>
    <fieldset id="ref-fieldset" class="luz-fieldset"><legend>Contact</legend></fieldset>

    <!-- A LUZ component's own button next to the bare ones: left to its component -->
    <button id="copy" class="luz-copy-btn" type="button">Copy</button>
    <div id="field" class="luz-field"><input id="field-input" class="luz-input" type="text" aria-label="In a field"></div>
  </article>

</body>
</html>
