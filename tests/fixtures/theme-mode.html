<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Theme mode: the button</title>
  <link rel="stylesheet" href="/packages/tokens/dist/luz-tokens.css">
  <link rel="stylesheet" href="/packages/core/dist/luz.css">
  <script type="module" src="/packages/core/dist/luz.min.js"></script>
</head>
<body>
  <main>
    <h1>Color mode</h1>
    <p>Text that sits under the mode button.</p>
    <p><a href="#start" id="before">A link before</a></p>
    <div id="slot">
    <luz-theme-mode id="mode">
      <fieldset class="luz-theme-mode__group">
        <legend class="luz-theme-mode__legend">Color mode</legend>
        <label class="luz-theme-mode__option"><input class="luz-theme-mode__input" type="radio" name="luz-theme-mode" value="auto" checked><svg class="luz-theme-mode__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M11 7a5 5 0 0 0 0 10ZM23 14A5 5 0 0 1 17 8a5 5 0 1 0 6 6Z"/></svg>Auto</label>
        <label class="luz-theme-mode__option"><input class="luz-theme-mode__input" type="radio" name="luz-theme-mode" value="light"><svg class="luz-theme-mode__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="5" fill="currentColor"/></svg>Light</label>
        <label class="luz-theme-mode__option"><input class="luz-theme-mode__input" type="radio" name="luz-theme-mode" value="dark"><svg class="luz-theme-mode__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M20 15A8 8 0 0 1 9 4a8 8 0 1 0 11 11Z"/></svg>Dark</label>
        <label class="luz-theme-mode__option"><input class="luz-theme-mode__input" type="radio" name="luz-theme-mode" value="high-contrast"><svg class="luz-theme-mode__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M12 3a9 9 0 0 1 0 18Z"/></svg>High contrast</label>
      </fieldset>
    </luz-theme-mode>
    </div>
    <p><a href="#end" id="after">A link after</a></p>
  </main>
  <!-- The query string authors the page: ?inline, ?no-remember, ?dir=rtl -->
  <script>
    (function () {
      var q = new URLSearchParams(location.search);
      var el = document.getElementById('mode');
      if (q.has('inline')) el.setAttribute('inline', '');
      if (q.has('no-remember')) el.setAttribute('no-remember', '');
      if (q.get('dir') === 'rtl') document.documentElement.dir = 'rtl';
    })();
  </script>
</body>
</html>
